version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: waste-postgres
    environment:
      POSTGRES_DB: waste_db
      POSTGRES_USER: waste
      POSTGRES_PASSWORD: waste
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waste -d waste_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: waste-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waste-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app/api
      - ./models:/models
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://waste:waste@postgres/waste_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MODELS_DIR=/models
      - STORAGE_LOCAL_ROOT=/app/storage
      - DEBUG=true
      - PYTHONPATH=/app
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waste-worker
    command: celery -A api.workers.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./api:/app/api
      - ./models:/models
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://waste:waste@postgres/waste_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MODELS_DIR=/models
      - STORAGE_LOCAL_ROOT=/app/storage
      - PYTHONPATH=/app
    env_file:
      - .env

  flower:
    image: mher/flower:2.0
    container_name: waste-flower
    command: celery -A api.workers.celery_app flower --port=5555 --basic_auth=user:pass
    ports:
      - "5555:5555"
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ./api:/app/api

volumes:
  pgdata:
  redisdata:
