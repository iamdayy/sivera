# Alembic configuration for Waste Volume Estimation API

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S


# Database URL - will be overridden by env var
sqlalchemy.url = postgresql+asyncpg://waste:waste@localhost:5432/waste_db

# Migration script location
script_location = alembic

# Version file location
version_locations = %(script_location)s/versions

# Use UTC timestamps
timezone = UTC

# File template
file_template = %%(rev)s_%%(slug)s

# Max identifier length
max_identifier_length = 63